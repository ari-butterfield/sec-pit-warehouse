name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/transform

jobs:
  quality:
    name: lint + dbt build (duckdb)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ruff (lint)
        run: ruff check .

      - name: ruff (format check)
        run: ruff format --check .

      - name: sqlfluff (lint)
        run: sqlfluff lint transform/models

      - name: pytest (ingest)
        run: pytest -q

      - name: seed ci duckdb with fixture quarter
        working-directory: ingest
        run: |
          mkdir -p .cache
          cp tests/fixtures/sample_quarter.zip .cache/1900q1.zip
          python load_sec_quarter.py 1900q1 --db-path ../transform/ci.duckdb

      - name: dbt build (duckdb)
        working-directory: transform
        run: |
          dbt deps
          dbt build --target ci
